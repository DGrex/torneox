{% extends "base.html" %}
{% block title %}Iniciar sesión · TorneoX{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white rounded-xl shadow p-8">
  <h1 class="text-2xl font-bold mb-6 text-center">TorneoX</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="w-full bg-green-700 text-white rounded-lg py-2 mt-4 hover:bg-green-800">
      Ingresar
    </button>
  </form>
</div>
{% endblock %}
